spring:
  application:
    name: zenticode-medical-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medical_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: ZenticodeMedicalPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    default-property-inclusion: non_null
    time-zone: America/Lima

server:
  port: ${PORT:8080}

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.zenticode.medical: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  security:
    bootstrap-consultorio-enabled: false
    bootstrap-usuario-enabled: false

    jwt:
      secret: ${JWT_SECRET}
      issuer: zenticode-medical-api
      expiration-minutes: 30